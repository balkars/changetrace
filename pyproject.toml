[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changetrace"
version = "0.1.0"
description = "Store engineering decision records in .context/ and warn before an edit undoes one."
requires-python = ">=3.11"
dependencies = ["click>=8.1", "PyYAML>=6.0"]

[project.optional-dependencies]
slack = ["slack_bolt>=1.18"]
dev = ["pytest>=8"]

[project.scripts]
ct = "changetrace.cli:main"
changetrace = "changetrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
changetrace = ["templates/**"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
